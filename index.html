<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3da9ff">
<title>Đổi Số Thành Chữ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Số → Chữ">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="top">
  <h1>Đổi Số Thành Chữ</h1>
  <p class="sub">Number to Words · Việt · English</p>
</header>

<main class="wrap">

  <section class="nhap">
    <label class="nhan" for="so-input">Nhập số</label>
    <div class="hang-nhap">
      <input type="text" id="so-input" class="o-nhap" inputmode="numeric"
             autocomplete="off" spellcheck="false" placeholder="Ví dụ: 1500000">
      <button type="button" id="btn-xoa" class="nut-xoa" aria-label="Xoá" hidden>✕</button>
    </div>

    <label class="cong-tac">
      <input type="checkbox" id="am-check">
      <span>Số âm</span>
    </label>

    <p class="loi" id="o-loi" hidden></p>
  </section>

  <section class="vat-dieu-khien" id="khu-vat-dieu-khien">
    <div class="vat-hang">
      <span class="vat-nhan">Số vừa nhập là</span>
      <div class="chips" id="che-do-vat">
        <button type="button" class="chip on" data-che-do="truoc">Giá trước thuế</button>
        <button type="button" class="chip" data-che-do="sau">Giá đã gồm thuế</button>
      </div>
    </div>
    <div class="vat-hang">
      <span class="vat-nhan">Thuế suất VAT</span>
      <div class="chips" id="ty-le-vat">
        <button type="button" class="chip" data-ty-le="0">0%</button>
        <button type="button" class="chip" data-ty-le="5">5%</button>
        <button type="button" class="chip on" data-ty-le="8">8%</button>
        <button type="button" class="chip" data-ty-le="10">10%</button>
      </div>
      <div class="ty-le-tuy-chinh">
        <input type="number" id="ty-le-input" min="0" max="100" step="0.1" value="8" inputmode="decimal">
        <span>%</span>
      </div>
    </div>
    <p class="vat-ghi-chu" id="vat-ghi-chu" hidden></p>
  </section>

  <section class="ket-qua" id="khu-ket-qua" hidden></section>

  <section class="trong" id="khu-trong">
    <p>Gõ một số vào ô bên trên để xem cách đọc bằng chữ (cả tiếng Việt lẫn
      tiếng Anh), cùng tiền thuế VAT và giá sau thuế.</p>
    <p class="vi-du">Ví dụ: <button type="button" class="thu" data-so="1500000">1.500.000</button>
      <button type="button" class="thu" data-so="1000000000">1.000.000.000</button>
      <button type="button" class="thu" data-so="1005">1.005</button></p>
  </section>

</main>

<script src="logic.js?v=2"></script>
<script src="app.js?v=3"></script>

<script>
// Đăng ký service worker để cài được ra màn hình chính và dùng khi mất mạng.
// Bọc trong điều kiện vì trình duyệt cũ không có, và lỗi ở đây không được phép
// làm hỏng trang — công cụ vẫn phải chạy bình thường khi không đăng ký nổi.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
